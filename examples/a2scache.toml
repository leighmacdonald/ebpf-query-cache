# Example a2scache refresh-daemon config.
#
# Install to /etc/a2scache.toml (`just install` does this), edit the
# [[server]] entries to point at your TF2 backends, then:
#   a2scache attach <iface> && a2scache serve --config /etc/a2scache.toml

[bpf]
# Directory holding the pinned maps + program (must match --pin-dir).
pin_dir = "/sys/fs/bpf/a2scache"

[defaults]
# How long the BPF program serves an entry before passing through (seconds).
# `attach --ttl-sec` sets an initial value; serve overwrites it with this.
# Instances may override this per [[server]] entry (ttl_secs).
ttl_secs = 30
# Time between refresh cycles per backend (seconds). Keep well below ttl_secs.
# Instances may override this per [[server]] entry (interval_secs).
interval_secs = 10
# Per-datagram receive timeout for the challenge dance (milliseconds, >= 100).
# Instances may override this per [[server]] entry (timeout_ms).
timeout_ms = 2000
# Token-bucket rate limits, in milli-tokens (see `a2scache status`).
# These limit CLIENT query rate (per-source-IP + one global bucket); they are
# not per-instance.
per_ip_capacity = 10000
per_ip_refill_per_s = 2000
global_capacity = 200000
global_refill_per_s = 50000

# One entry per game instance. The BPF cache key is (ip, port): two servers
# on the same host need one entry per port, and duplicates of the same
# (ip, port) are rejected. The cache map holds at most
# a2s_protocol::CACHE_MAX_ENTRIES (4096) instances; the daemon refuses a
# config with more.
#
# Every per-instance field is optional and falls back to [defaults]:
#
#   mac          source MAC of synthesized replies. Optional: when set, the
#                first server's MAC becomes the global source MAC of
#                synthesized replies (otherwise the MAC recorded by `attach`
#                is kept; BPF holds a single global MAC).
#   ttl_secs     per-instance freshness window override.
#   interval_secs per-instance refresh cadence override.
#   timeout_ms   per-instance receive timeout override.
#
# IMPORTANT: use the address you want CLIENTS to see (the IP the BPF
# program answers for), and make sure the daemon can reach the server at
# that address. The Source engine ignores A2S requests arriving with a
# 127/8 source address, so 127.0.0.1 backends will never warm — use the
# machine's real IP (or the server's public IP for a remote backend).

[[server]]
ip = "192.0.2.10"
port = 27015
# mac = "aa:bb:cc:dd:ee:ff"
# ttl_secs = 60
# interval_secs = 5
# timeout_ms = 1500

# A low-population instance: refreshed less often, kept warm longer.
[[server]]
ip = "192.0.2.10"
port = 27025
ttl_secs = 90
interval_secs = 30
